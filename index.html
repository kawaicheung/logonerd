<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Nerd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="sidebar">
    <nav id="timeline-filters">
      <div id="timeline-list"></div>
    </nav>

    <nav id="events-filter">
      <div id="events-list"></div>
    </nav>
  </div>

  <div id="site-title">
    <div id="site-title-main">LogoNerd</div>
    <div id="site-author">By Ka Wai Cheung</div>
  </div>

  <section id="controls">
    <button id="sort-order" type="button" class="control-btn">Newest first</button>
    <button id="reset-filters" type="button" class="control-btn">All</button>
  </section>

  <button id="favorites-toggle" type="button" class="icon-shortcut" aria-pressed="false" aria-label="Toggle favorites">
    <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.26 6.6.6-5 4.53 1.5 6.7L12 16.9l-6 3.7 1.5-6.7-5-4.53 6.6-.6z"/></svg>
  </button>

  <div id="page-content">
    <main id="grid"></main>
    <p id="share-favorites">
      <a id="share-favorites-link" href="#">Link to share your favorites</a>
    </p>
  </div>

  <div id="footer"></div>

  <script src="data.js?v=20260807a"></script>
  <script src="script.js?v=20260807h"></script>
</body>
</html>
