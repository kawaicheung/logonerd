<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Nerd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="sidebar">
    <nav id="timeline-filters">
      <div id="timeline-list"></div>
    </nav>

    <nav id="events-filter">
      <div id="events-list"></div>
    </nav>
  </div>

  <div id="site-title">
    <div id="site-title-row">
      <button id="favorites-toggle" type="button" class="icon-shortcut" aria-pressed="false" aria-label="Toggle favorites">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.26 6.6.6-5 4.53 1.5 6.7L12 16.9l-6 3.7 1.5-6.7-5-4.53 6.6-.6z"/></svg>
      </button>
      <div id="site-title-main">LogoNerd</div>
    </div>
    <div id="site-author">By Ka Wai Cheung</div>
  </div>

  <div id="favorites-bar">
    <h3 id="favorites-heading">Your Favorites</h3>
    <div id="share-favorites">
      <button id="share-favorites-btn" type="button" class="icon-shortcut" aria-label="Copy share link">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </button>
      <span id="share-feedback">Link copied!</span>
    </div>
  </div>

  <div id="page-content">
    <main id="grid"></main>
    <button id="sort-order-btn" type="button" class="icon-shortcut" aria-label="Toggle sort order">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
    </button>
  </div>

  <div id="footer"></div>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="data.js?v=20260807a"></script>
  <script src="script.js?v=20260807m"></script>
</body>
</html>
