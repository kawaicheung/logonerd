<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Nerd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="sidebar">
  <nav id="events-filter">
    <div id="events-list"></div>
  </nav>

  <nav id="timeline-filters">
    <div id="timeline-list"></div>
  </nav>
</div>

<div id="page-content">

<header>
  <h1>Logo Nerd</h1>
  <p class="subtitle">A browsable archive of championship event logos.</p>
</header>

<section id="controls">
  <div class="control">
    <label for="sort-order">Sort</label>
    <select id="sort-order">
      <option value="desc">Year: newest first</option>
      <option value="asc">Year: oldest first</option>
    </select>
  </div>

  <button id="reset-filters" type="button">Reset</button>

  <div class="control toggles">
    <label for="meta-toggle-input">
      <input type="checkbox" id="meta-toggle-input" checked>
      Show details
    </label>
    <label for="favorites-toggle-input">
      <input type="checkbox" id="favorites-toggle-input">
      Show favorites
    </label>
  </div>
</section>

<main id="grid"></main>

<p id="share-favorites">
  <a id="share-favorites-link" href="#">Link to share your favorites</a>
</p>

<footer>
  <p>Logo images &copy; their respective leagues/events, sourced from <a href="https://sportslogos.net/">SportsLogos.net</a>.</p>
  <p>This is just a site for the love of logos. Not affiliated with any league or event!</p>
</footer>

</div>

<script src="data.js?v=20260806n"></script>
<script src="script.js?v=20260806n"></script>
</body>
</html>
