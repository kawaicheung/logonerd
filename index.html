<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Nerd</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Logo Nerd</h1>
  <p class="subtitle">A browsable archive of championship event logos.</p>
</header>

<section id="controls">
  <div class="control">
    <label for="event-filter">Event</label>
    <select id="event-filter">
      <option value="all">All events</option>
    </select>
  </div>

  <div class="filter-pair">
    <div class="control" id="year-control">
      <label for="year-filter">Year</label>
      <select id="year-filter">
        <option value="all">All years</option>
      </select>
    </div>

    <div class="control" id="decade-control">
      <label for="decade-filter">Decade</label>
      <select id="decade-filter">
        <option value="all">All decades</option>
      </select>
    </div>
  </div>

  <div class="control">
    <label for="sort-order">Sort</label>
    <select id="sort-order">
      <option value="desc">Year: newest first</option>
      <option value="asc">Year: oldest first</option>
    </select>
  </div>

  <button id="reset-filters" type="button">Reset</button>

  <div class="control result-count">
    <span id="result-count"></span>
  </div>
</section>

<main id="grid"></main>

<footer>
  <p>Logo images &copy; their respective leagues/events, sourced from <a href="https://sportslogos.net/">SportsLogos.net</a>.</p>
  <p>This is just a site for the love of logos. Not affiliated with any league or event!</p>
</footer>

<script src="data.js?v=20260804"></script>
<script src="script.js?v=20260804"></script>
</body>
</html>
