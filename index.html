<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Nerd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="sidebar">
  <nav id="timeline-filters">
    <div id="timeline-list"></div>
  </nav>

  <nav id="events-filter">
    <div id="events-list"></div>
  </nav>
</div>


<section id="controls">
  <div id="site-title">LogoNerd</div>

  <div class="control">
    <select id="sort-order">
      <option value="desc">Year: newest first</option>
      <option value="asc">Year: oldest first</option>
    </select>
  </div>

  <button id="reset-filters" type="button">Reset</button>

    <label for="meta-toggle-input">
      <input type="checkbox" id="meta-toggle-input" checked>
      Show details
    </label>
    <label for="favorites-toggle-input">
      <input type="checkbox" id="favorites-toggle-input">
      Show favorites
    </label>
</section>

<div id="page-content">


<main id="grid"></main>

<p id="share-favorites">
  <a id="share-favorites-link" href="#">Link to share your favorites</a>
</p>

</div>

<script src="data.js?v=20260806q"></script>
<script src="script.js?v=20260807a"></script>
</body>
</html>
