<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>LogoNerd : Sporting event logos throughout the decades</title>
  <meta property="og:image" content="https://logonerd.kawaicheung.io/opengraph.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://logonerd.kawaicheung.io/opengraph.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260818d">
</head>
<body>

  <div id="app">
    <div id="logo">LogoNerd</div>

    <div id="search-options">
      <nav id="timeline-filters" class="nav-filter">
        <div id="timeline-list"></div>
      </nav>

      <nav id="events-filter" class="nav-filter">
        <div id="events-list"></div>
      </nav>

      <div id="places-or">OR</div>

      <nav id="places-filter" class="nav-filter">
        <div id="places-list"></div>
      </nav>
    </div>

    <div id="quick-actions">
      <button id="favorites-toggle" type="button" class="icon-shortcut" aria-pressed="false" aria-label="Toggle favorites">
        <svg viewBox="0 0 24 24">
          <defs>
            <path id="fav-star" d="M12 2.5l2.9 6.26 6.6.6-5 4.53 1.5 6.7L12 16.9l-6 3.7 1.5-6.7-5-4.53 6.6-.6z"/>
          </defs>
          <use href="#fav-star" transform="translate(2.2,2.38) scale(0.4)"/>
          <use href="#fav-star" transform="translate(15.64,2.77) scale(0.28)"/>
          <use href="#fav-star" transform="translate(7.8,8.07) scale(0.6)"/>
        </svg>
      </button>
      <button id="randomize-btn" type="button" class="icon-shortcut" aria-label="Show a random logo">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4"></rect>
          <circle cx="8" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle>
          <circle cx="16" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle>
          <circle cx="8" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
          <circle cx="16" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
          <circle cx="8" cy="16.5" r="1.4" fill="currentColor" stroke="none"></circle>
          <circle cx="16" cy="16.5" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
      <button id="search-toggle" type="button" class="icon-shortcut" aria-label="Toggle filters">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>

    <div id="filter-title-bar">
      <div id="filter-title-group">
        <h3 id="filter-title"></h3>
        <div id="item-meta"></div>
      </div>
      <button id="item-favorite" class="favorite-btn" type="button" aria-label="Toggle favorite">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.26 6.6.6-5 4.53 1.5 6.7L12 16.9l-6 3.7 1.5-6.7-5-4.53 6.6-.6z"/></svg>
      </button>
      <button id="sort-order-btn" type="button" class="icon-shortcut" aria-label="Toggle sort order">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
      </button>
      <div id="share-favorites">
        <button id="share-favorites-btn" type="button" class="icon-shortcut" aria-label="Copy share link">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </button>
        <span id="share-feedback">Link copied!</span>
      </div>
    </div>

    <div id="page-content">
      <main id="grid"></main>
      <div id="item-display">
        <button id="item-prev" class="item-nav" type="button" aria-label="Previous logo">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <img id="item-img" src="" alt="">
        <button id="item-next" class="item-nav" type="button" aria-label="Next logo">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>

    <div id="attribution">Logonerd by <a href="https://kawaicheung.io/software">Ka Wai Cheung</a>, a fan of sports, logos, &amp; design trends. All images courtesy of <a href="https://sportslogos.net/" target="_blank" rel="noopener noreferrer">SportsLogos.net</a>.</div>
  </div>

  <div id="app-mobile">
    <div id="mobile-title-bar">
      <h3 id="mobile-filter-title"></h3>
    </div>

    <div id="mobile-item-display">
      <img id="mobile-item-img" src="" alt="">
    </div>

    <div id="mobile-brand">
      <div id="mobile-brand-title">LogoNerd</div>
    </div>

    <button id="mobile-randomize-btn" type="button" aria-label="Show a random logo">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16.5" r="1.4" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>

  </div>

  <script src="data.js?v=20260817c"></script>
  <script src="script.js?v=20260818a"></script>
</body>
</html>
