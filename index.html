<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Nerd</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav id="timeline-filters">
  <div id="year-scroll" class="years-rail"></div>
  <div id="decade-scroll" class="decades-rail"></div>
</nav>

<div id="page-content">

<header>
  <h1>Logo Nerd</h1>
  <p class="subtitle">A browsable archive of championship event logos.</p>
</header>

<section id="controls">
  <div class="control">
    <label for="event-filter">Event</label>
    <div class="select-wrap">
      <select id="event-filter">
        <option value="all">All events</option>
      </select>
      <button id="event-clear" class="clear-btn" type="button" aria-label="Clear event filter">&times;</button>
    </div>
  </div>

  <div class="control">
    <label for="sort-order">Sort</label>
    <select id="sort-order">
      <option value="desc">Year: newest first</option>
      <option value="asc">Year: oldest first</option>
    </select>
  </div>

  <button id="reset-filters" type="button">Reset</button>

  <div class="control toggles">
    <label for="meta-toggle-input">
      <input type="checkbox" id="meta-toggle-input" checked>
      Show details
    </label>
    <label for="favorites-toggle-input">
      <input type="checkbox" id="favorites-toggle-input">
      Show favorites
    </label>
  </div>
</section>

<main id="grid"></main>

<footer>
  <p>Logo images &copy; their respective leagues/events, sourced from <a href="https://sportslogos.net/">SportsLogos.net</a>.</p>
  <p>This is just a site for the love of logos. Not affiliated with any league or event!</p>
</footer>

</div>

<script src="data.js?v=20260806c"></script>
<script src="script.js?v=20260806c"></script>
</body>
</html>
